; PlatformIO project configuration for the ESP8266 MQTT/SSL + OTA + OLED node.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; The sketch also builds fine in the Arduino IDE: open
; IoT_ESP8266_MCU_OLED.ino directly, install the libraries listed below
; via Library Manager, and select an ESP8266 board (e.g. "NodeMCU 1.0").

[platformio]
; The sketch lives at the repository root (Arduino IDE layout).
src_dir = .

[env]
; Only the sketch is project source; .pio/ holds downloaded libraries.
build_src_filter = +<*.ino>

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0
